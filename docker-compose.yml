services:
  municipal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: municipal_grievance_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=municipal-prod-secret-key-2026
      - DATABASE_PATH=/app/data/grievances.db
      - FLASK_ENV=production
    volumes:
      - grievance_data:/app/data
    networks:
      - municipal_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  grievance_data:
    driver: local

networks:
  municipal_net:
    driver: bridge
